<!DOCTYPE html>
<html>

<head>
    <title>Fake News Detector</title>
</head>

<body>

    <h1>Fake News Detection System</h1>

    <form action="/predict" method="POST">

        <textarea name="news" rows="10" cols="50"></textarea>

        <br><br>

        <button type="submit">Check News</button>

    </form>

    {% if prediction %}

        <h2>{{ prediction }}</h2>

    {% endif %}

</body>

</html>
